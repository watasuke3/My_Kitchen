# https://www.playframework.com/documentation/latest/Configuration

play.filters.enabled += "play.filters.cors.CORSFilter"

# このアプリは Play の標準セッション機構を使わず、独自の SESSION_ID Cookie
# (SameSite=Strict) でセッション管理をしている。CSRFFilter は
# 「Cookie を持つ = セッションあり」とみなしトークンを要求するが、
# トークン発行の仕組みを実装していないため、ログイン後の全ての
# POST/PUT/DELETE が 403 になってしまう。
# CSRF 対策は SameSite=Strict Cookie に一本化し、CSRFFilter は無効化する。
play.filters.disabled += "play.filters.csrf.CSRFFilter"

slick.dbs.default {
  profile = "slick.jdbc.PostgresProfile$"
  db {
    driver   = "org.postgresql.Driver"
    url      = "jdbc:postgresql://localhost:5432/"${?POSTGRES_DB}
    user     = ${?POSTGRES_USER}
    password = ${?POSTGRES_PASSWORD}
  }
}

play.evolutions.db.default.autoApply = true

play.http.secret.key = ${?APPLICATION_SECRET}

play.filters.cors {
  allowedOrigins = ["http://localhost:5173", "http://127.0.0.1:5173"]
  allowedHttpMethods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allowedHttpHeaders = ["Content-Type", "Authorization"]
}
